      - spark-master

    volumes:
      - ./data:/data

  ecommerce-api:
    build: .

    container_name: ecommerce-api

    depends_on:
      - spark-master

    ports:
      - "8080:8080"
      - "4040:4040"

    volumes:
      - ./data:/data